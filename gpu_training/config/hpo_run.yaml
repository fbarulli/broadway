# HPO fan-out profile (SSOT). No study name, budget, seed, or storage URL in code.
#
# The study itself — model, search space, direction, metric, budget, dataset,
# experiment, storage policy — lives in the study config below. The project HPO
# spec (hpo_spec there) owns the search space and the budget; no profile invents
# either.
command: "python gpu_training/hpo_kernel.py --config {kernel_config} --n-trials {n_trials} --micro-batch {micro_batch} --worker {worker} --seed {seed} --objective {objective} --storage {storage}"
kernel_config: hpo_kernel.yaml

# Run seed. Each worker derives its sampler seed as seed + worker, so parallel
# cold starts never draw the same TPE startup sequence.
seed: 1729

# The adapter factory: build(study) -> objective(params, trial) -> float.
objective: adapters.taxi:build

# Env var that holds the shared Optuna URL; never a file or a literal.
storage_env: OPTUNA_STORAGE_URL

# GPU ids visible to the launcher (one worker per MPS slot).
# One T4 with MPS slots: gpus: [0], mps_slots_per_gpu: 2 — only if the measured
# per-trial footprint fits twice. The Kaggle 2xT4 profile overrides this block.
gpus: [0]
mps_slots_per_gpu: 2

# Optional override; null means "use the baseline's concurrent_trials".
workers: null
