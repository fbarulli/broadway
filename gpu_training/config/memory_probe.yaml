# Memory-probe config (SSOT for the sweep). No value is repeated in code.
#
# `step` is the adapter entry point: module:function implementing
#   step(batch_size, seq_len, device, dtype) -> param_count | None
# The shipped smoke adapter works on CPU; point this at the real trainer
# adapter on the GPU host.
step: adapters.cpu_smoke:step

device: cpu          # cuda | cpu
dtype: fp32          # fp32 | fp16 | bf16
seq_len: 256
batches: [1, 2, 4, 8, 16, 32]

# Fraction of total VRAM (cuda) / available RAM (cpu) a trial may use.
headroom: 0.90

# Machine baseline artifact (git-ignored if under artifacts/, tracked here as
# evidence when the owner promotes it).
output: baseline/memory_baseline.json
