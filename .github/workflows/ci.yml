name: CI

on:
  push:
    branches: [main, taxi, sklearn]
  pull_request:
    branches: [main, taxi, sklearn]

# Rapid pushes to the same branch/PR cancel the in-flight run — no wasted
# compute on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; CD elevates packages only where required.
permissions:
  contents: read

jobs:
  platform:
    name: Platform gates (src + tests + maintained surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch parity needs both branch tips.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # --frozen: fails if pyproject.toml and uv.lock have drifted.
      - name: Install
        run: uv sync --all-extras --frozen

      # Platform gates — SINGLE SOURCE OF TRUTH: this job runs
      # scripts/run_local_ci.sh (branch parity era-aware, ruff, mypy,
      # configs parse, tests+cov≥95%). Edit the gate list in the SCRIPT,
      # never here — editing YAML alone reopens two-source drift.
      - name: Platform gates (SSOT)
        run: bash scripts/run_local_ci.sh

      # CI-only — named in scripts/run_local_ci.sh header.
      # k8s lifecycle + entrypoint scripts must at least be valid shell; the
      # runner ships shellcheck (syntax-level CI — the deployment itself is a
      # manual on-demand run via k8s/optuna/lifecycle.sh).
      - name: Shell scripts (sh -n + shellcheck)
        shell: bash
        run: |
          set -euo pipefail
          for f in k8s/optuna/*.sh; do
            sh -n "$f"
          done

          # Don't silently weaken CI if shellcheck disappears from the runner.
          shellcheck k8s/optuna/*.sh

      # CI-only — named in scripts/run_local_ci.sh header.
      # Pull once; reuse the exact kubeconform image in later checks.
      - name: Pull kubeconform
        run: docker pull ghcr.io/yannh/kubeconform:v0.6.7

      # CI-only — named in scripts/run_local_ci.sh header.
      # Manifests must be structurally valid Kubernetes (no cluster needed).
      - name: Manifests (kubeconform)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            -ignore-filename-pattern "kind-config\\.yaml" \
            k8s/optuna/

      # CI-only — named in scripts/run_local_ci.sh header.
      # Orchestrator dry-run: render the worker Jobs for the HPO spec's models
      # and assert they are valid Kubernetes with the right image/env/args.
      - name: Orchestrator dry-run (render worker jobs)
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/jobs"

          uv run python k8s/optuna/render_worker_jobs.py \
            --image broadway-optuna-worker:ci \
            > "${RUNNER_TEMP}/jobs/jobs.yaml"

          grep -q "broadway-optuna-worker:ci" "${RUNNER_TEMP}/jobs/jobs.yaml"
          grep -q "BROADWAY_MLFLOW_CONFIG" "${RUNNER_TEMP}/jobs/jobs.yaml"
          grep -q -- "--model" "${RUNNER_TEMP}/jobs/jobs.yaml"

          docker run --rm \
            -v "${RUNNER_TEMP}/jobs:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /work/jobs.yaml

      # CI-only — named in scripts/run_local_ci.sh header.
      - name: Experiment smoke (taxi branch only — experiments.py)
        if: github.ref == 'refs/heads/taxi' || (github.event_name == 'pull_request' && github.base_ref == 'taxi')
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
        run: uv run python experiments.py verify

  # CI-only — named in scripts/run_local_ci.sh header.
  # Build & Boot — structural determinism of the deployment images WITHOUT a
  # cluster. Catches missing files / broken COPY paths / PYTHONPATH and import
  # failures / parents[] resolution / eager-default traps / config structure.
  # Runtime semantics (kind cluster + workers + dump/restore) stay a manual,
  # on-demand `lifecycle.sh train` — this gate never runs training.
  #
  # ONLY broadway-base is cached: GitHub cache entries are immutable, so a
  # same-key save/restore of all three images would permanently restore a
  # stale worker/mlflow snapshot. The cache key hashes EVERYTHING
  # Dockerfile.base bakes in — deps AND code (src/**, project/**): keyed on
  # pyproject/lock/base-Dockerfile alone, a src-only change would hit the
  # cache and restore an OLD-code base; workers inherit it, boot tests pass
  # on stale platform code, and CD stamps the new sha — a silently
  # mislabeled-provenance ship.
  #
  # Worker/mlflow are unconditional rebuilds tagged github.sha: they are thin
  # COPY layers over the base, so per-run rebuild cost is small, and the
  # exact tested sha-tagged images are what later consumers must expect.
  build-and-boot:
    name: Build & Boot (docker images — no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Restore previously saved base image so the chained FROM resolves
      # instantly and unchanged dep/code layers skip rebuilding.
      - name: Restore base image
        id: base-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/broadway-base.tar.gz
          key: broadway-base-${{ hashFiles('pyproject.toml', 'uv.lock', 'k8s/optuna/Dockerfile.base', 'src/**', 'project/**') }}

      - name: Load cached base image
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: |
          gzip -dc "${RUNNER_TEMP}/broadway-base.tar.gz" | docker load

          # Sanity: fail fast rather than building FROM a missing/partial base.
          docker image inspect broadway-base:latest >/dev/null

      - name: Build base image
        if: steps.base-cache.outputs.cache-hit != 'true'
        # Tag :latest so worker/mlflow `FROM broadway-base:latest` resolves
        # locally on a cold cache (docker pulls from the registry otherwise).
        run: |
          docker build \
            -f k8s/optuna/Dockerfile.base \
            -t broadway-base:latest \
            .

      - name: Save base image for future runs
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          docker save broadway-base:latest | gzip -1 > "${RUNNER_TEMP}/broadway-base.tar.gz"

      # Thin COPY-only layers over the base — rebuilt unconditionally so they
      # always carry this exact commit's code under an immutable sha tag.
      - name: Build worker image
        run: |
          docker build \
            -f k8s/optuna/Dockerfile.worker \
            -t broadway-optuna-worker:${{ github.sha }} \
            .

      - name: Build mlflow image
        run: |
          docker build \
            -f k8s/optuna/Dockerfile.mlflow \
            -t mlflow-server:${{ github.sha }} \
            .

      # Imports _common -> project.working (working.yaml), resolves
      # HPO_CONFIG_PATH via parents[] at the mirrored pod path, parses the HPO
      # spec and builds CLI choices. Catches the layout/import bug class.
      - name: Boot — worker imports + CLI
        run: docker run --rm broadway-optuna-worker:${{ github.sha }} python /app/experiments/mlflow/03_optuna_worker.py --help

      # Config-load simulation with the committed fixture: verifies the
      # configmap structure + the HPO spec both parse inside the pod layout.
      # Literal block (run: |) — folded scalars collapse the newlines the
      # python -c string needs.
      - name: Boot — config-load simulation
        run: |
          docker run --rm -v "$PWD/.github/ci-fixtures/k8s-config.yaml:/etc/broadway/config.yaml" broadway-optuna-worker:${{ github.sha }} python -c "
          import yaml
          from pathlib import Path
          from broadway.config.schema import HPOConfig
          cfg = yaml.safe_load(Path('/etc/broadway/config.yaml').read_text())
          assert {'dataset','databases','mlflow'} <= set(cfg), 'configmap structure'
          hpo = HPOConfig(**yaml.safe_load(
              Path('/app/configs/experiments/mlflow.yaml').read_text())['hpo'])
          print('config load OK — models:', [m.name for m in hpo.models])"

      - name: Boot — mlflow image health
        run: docker run --rm --entrypoint python mlflow-server:${{ github.sha }} -c "import mlflow; print('mlflow', mlflow.__version__)"

      # Protected refs ONLY: package the exact sha-tagged images that just
      # passed boot tests, so cd publishes bit-for-bit what was verified —
      # zero rebuilds downstream. sklearn/PR runs deploy nothing.
      - name: Package verified deployment images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/taxi')
        run: |
          docker save \
            broadway-optuna-worker:${{ github.sha }} \
            mlflow-server:${{ github.sha }} \
            -o "${{ runner.temp }}/verified-images.tar"

      # compression-level: 0 — Docker layers arrive compressed; don't pay CPU
      # to recompress them.
      - name: Upload verified images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/taxi')
        uses: actions/upload-artifact@v4
        with:
          name: verified-images-${{ github.sha }}
          path: ${{ runner.temp }}/verified-images.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # CD — publish to GHCR the EXACT images build-and-boot just tested, on push
  # to main/taxi ONLY (never PRs; sklearn deploys nothing). No checkout, no
  # rebuilds: the job downloads the artifact packaged above and re-tags it, so
  # what ships is bit-for-bit what passed every gate. lifecycle.sh consumes
  # the pushed tag via OPTUNA_WORKER_IMAGE.
  #
  # Tag law: push to main ⇒ worker/mlflow get their commit-sha tag AND
  # :latest; push to taxi ⇒ the sha tag AND :taxi. broadway-base stays
  # CI-private (internal FROM parent, not a deployable surface).
  cd:
    name: CD (push images to GHCR)
    needs: [platform, build-and-boot]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/taxi')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Serialize deploys per ref: overlapping runs must never interleave
    # :latest / :taxi layer pushes into a torn mutable tag.
    concurrency:
      group: cd-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load verified images
        run: |
          docker load -i "${{ runner.temp }}/verified-images.tar"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha tag always; :latest only from main; :taxi only from taxi.
      - name: Push verified images to GHCR
        shell: bash
        run: |
          set -euo pipefail

          ref="${{ github.ref }}"
          registry="ghcr.io/${{ github.repository }}"

          for img in broadway-optuna-worker mlflow-server; do
            docker tag "$img:${{ github.sha }}" "$registry/$img:${{ github.sha }}"
            docker push "$registry/$img:${{ github.sha }}"

            if [ "$ref" = "refs/heads/main" ]; then
              docker tag "$img:${{ github.sha }}" "$registry/$img:latest"
              docker push "$registry/$img:latest"
            fi

            if [ "$ref" = "refs/heads/taxi" ]; then
              docker tag "$img:${{ github.sha }}" "$registry/$img:taxi"
              docker push "$registry/$img:taxi"
            fi
          done
