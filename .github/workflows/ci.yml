name: CI

on:
  push:
    branches: [main, taxi]
  pull_request:
    branches: [main, taxi]

jobs:
  platform:
    name: Platform gates (src + tests only — experiments/ excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Install
        run: uv sync --extra dev --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src/broadway

      - name: Tests + coverage (platform suite)
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
        run: uv run pytest tests/ --cov=src/broadway --cov-report=term-missing --cov-fail-under=85

      - name: Experiment smoke (taxi branch only — verify_experiments.py)
        if: github.ref == 'refs/heads/taxi' || (github.event_name == 'pull_request' && github.base_ref == 'taxi')
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
        run: uv run python verify_experiments.py
