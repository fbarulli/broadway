columns:
  airport_fee:
    dtype: float64
    null_count: 0
    role: feature
  dropoff_location_id:
    dtype: int32
    null_count: 0
    role: feature
  passenger_count:
    dtype: float64
    null_count: 0
    role: feature
  pickup_datetime:
    dtype: datetime64
    null_count: 0
    role: datetime
  pickup_location_id:
    dtype: int32
    null_count: 0
    role: feature
  total_amount:
    dtype: float64
    null_count: 0
    role: feature
  trip_distance:
    dtype: float64
    null_count: 0
    role: feature
  trip_duration_minutes:
    dtype: float64
    null_count: 0
    role: target
datetime_column: pickup_datetime
lookup_tables:
  pickup_location_id:
    path: data/raw/taxi_zone_lookup.csv
    key: LocationID
    value_policies:
      Borough:
        sentinel_values:
          - "Unknown"
    na_values:
      - ""
      - NA
      - N/A
      - "null"
      - "None"
      - "?"
  dropoff_location_id:
    path: data/raw/taxi_zone_lookup.csv
    key: LocationID
    value_policies:
      Borough:
        sentinel_values:
          - "Unknown"
    na_values:
      - ""
      - NA
      - N/A
      - "null"
      - "None"
      - "?"
name: taxi
path: data/processed/training_data.parquet
target: trip_duration_minutes
task: regression
exclude_from_profiling:
  - pickup_location_id
  - dropoff_location_id
