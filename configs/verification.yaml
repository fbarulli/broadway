# configs/verification.yaml — live verification evidence SSOT (LIVE_VERIFICATION.md §3).
#
# Consumers:
#   scripts/verify_live.py -> output_dir, default_timeout_seconds, output_tail_lines
#
# Provenance only: rows/hashes/timestamps in the evidence record are recorded so a
# result can be traced, never used to accept or reject data (LIVE_VERIFICATION.md §4).
output_dir: artifacts/verification
default_timeout_seconds: 1800
# Output lines kept in stdout_tail/stderr_tail of one evidence record.
output_tail_lines: 20
