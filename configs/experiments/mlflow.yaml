# mlflow model-battle experiment — run knobs + the unified HPO spec.
# HPO search spaces + budgets for the unified optuna API (synthetic demo).
# (configs/experiments/working.yaml). Model recipes stay in code: they
# reference the platform model registry / sklearn classes. The HPO search
# spaces and trial budgets (hpo:) are the single source of truth for BOTH
# the battle orchestrator (01, hpo.run_hpo) and the k8s per-model workers
# (03, hpo.run_model_study) — the k8s worker only injects the RDB storage_url
# at runtime, so no storage_url is set here.
sample_size: 1000
test_fraction: 0.2
seed: 42
continuous_features: [rooms, area]
categorical_features: [neighborhood]
hpo:
  engine: optuna
  direction: minimize
  target_metric: mae
  total_trials: 100
  initial_trials_per_model: 20
  top_k: 2
  models:
    - name: lgbm
      search_space:
        n_estimators: [50, 500]
        max_depth: [3, 12]
        learning_rate: [0.01, 0.3]
        num_leaves: [8, 127]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
        min_child_samples: [5, 100]
        reg_alpha: [1e-3, 10]
        reg_lambda: [1e-3, 10]
    - name: xgb
      search_space:
        n_estimators: [50, 500]
        max_depth: [3, 12]
        learning_rate: [0.01, 0.3]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
        min_child_weight: [1, 10]
        reg_alpha: [1e-3, 10]
        gamma: [0.0, 5.0]
    - name: knn
      # Numeric-only space (the unified schema is [low, high] pairs); the
      # categoricals (weights, algorithm) are allowed params for explicit
      # passes but cannot be expressed in a search space.
      search_space:
        n_neighbors: [3, 50]
        p: [1, 2]
        leaf_size: [10, 100]
    - name: linear
      search_space: {}
