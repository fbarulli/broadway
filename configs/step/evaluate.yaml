target_metric: rmse
promotion_threshold: 0.05
coverage_tolerance: 0.05
# Where the holdout interval comes from: `conformal` uses the split-conformal
# q fitted at training time; `quantile` reads the candidate artifact's own
# lower/mid/upper predictions (experiment.model.params.alpha is the level).
interval_source: conformal
# Weekly coverage periods with fewer rows are excluded: a partial terminal
# week must never be read as a coverage collapse (complete-bucket rule).
min_period_rows: 100
output_dir: artifacts/evaluation
output_file: metrics.json
# Error analysis ("where the model fails"): every holdout row is tracked with
# its truth, prediction, residual and segment columns. Paths live here, never
# as code literals.
error_analysis:
  ledger_file: errors.parquet
  thresholds_file: thresholds.json
  # Names must exist in the experiment's ColumnPlan; empty carries the whole
  # plan into the ledger (the plan is the keep-set, never a code-side list).
  segment_columns: []
# Residual diagnostics read the ledger above: residual autocorrelation at
# lags 1..acf_lags, the Ljung-Box portmanteau at ljung_box_lags, and the
# Jarque-Bera/QQ normality read.
residuals:
  acf_lags: 3
  ljung_box_lags: 3
# Percentile bootstrap for the holdout metric intervals (rmse/mae/mape);
# numpy-only, deterministic at the configured seed.
bootstrap:
  iterations: 200
  seed: 42
  level: 0.95
# Time-series CV verdict: the candidate's paired improvement over the
# seasonal-naive (or persistence) baseline, tested with the bootstrap above.
# `metric` names the CV metric; `direction: max` reads positive improvement as
# better; the verdict is act / investigate / no_action / insufficient at
# `min_effect` (metric units) and `min_sample_size` scored rows.
cv_decision:
  metric: rmse
  direction: max
  min_effect: 0.1
  min_sample_size: 1000
  action: ship the candidate
  owner: fare_prediction
# Opt-in binary framing over a regression target: `threshold` is the truth
# event (a row is positive when its value reaches it); the grid samples
# candidate model cutoffs for the configured objective. Delete this block to
# evaluate regression-only — the ledger still ships, thresholds.json does not.
decision:
  threshold: 15.0
  objective: f1
  grid:
    min: 5.0
    max: 60.0
    steps: 12
