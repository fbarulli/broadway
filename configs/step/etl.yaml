# STATE-20260921-004 custody: the etl/train-side tracking writers (001/002)
# emit ignored machine truth to artifacts/tracking/{data_manifest.json,
# baseline_stats.json}; the tracked reports/tracking/ surface + MLflow
# run-artifact copy are published downstream (report renderer / train hook),
# never here.
ci_sample_size: 50000
max_drop_fraction: 0.1
random_state: 42
train_file: train.parquet
val_file: val.parquet
training_data_file: training_data.parquet
train_features_file: train_features.parquet
val_features_file: val_features.parquet
missing_encodings:
  - ""
  - NA
  - N/A
  - "null"
  - "None"
  - "?"
