# STATE-20260921-004 custody: train logs the artifacts/tracking/ bundle copy
# as MLflow run artifacts (see log_datasets hook, 003); artifacts/tracking/
# stays git-ignored, reports/tracking/ stays the tracked published surface.
random_state: 42
n_jobs: -1
cv_folds: 5
# Forward-chaining CV: the training window expands chronologically and each
# validation block follows it. Shuffled KFold would train on rows after the
# rows it scores (leakage on time-ordered data), so the config and
# the PipelineConfig validator both refuse kfold for a time split.
cv_kind: expanding
# Rows dropped between a training prefix and its validation block.
cv_gap: 1
# Time-series CV geometry (this dataset is cross-sectional rows, so the
# multi-step knobs stay at their 1-step / no-season defaults). For a regular series:
#   cv_kind: rolling          # fixed-length window instead of expanding
#   cv_train_size: 168        # rows (7 whole 24-step days)
#   cv_seasonal_period: 24    # fold boundaries on whole cycles
#   cv_horizon: 24            # multi-step origins; requires cv_gap >= 24
model_file: model.pkl
n_estimators: 500
learning_rate: 0.05
num_leaves: 63
subsample: 0.8
colsample_bytree: 0.8
quantile_tail: 0.9
output_dir: artifacts/training
output_file: training_result.json
# Training-size curve: metric vs fraction of the deployed fit slice, run after
# HPO and the calibration split and BEFORE the full fit. Reports the smallest
# fraction within the tolerance band — the minimum-data answer. COST: every
# train run with this block enabled pays one refit per fraction before the
# full fit (4 extra fits for the fractions below). `repeats` applies to
# random/stratified draws; a time split always uses one chronological prefix.
learning_curve:
  fractions: [0.1, 0.25, 0.5, 1.0]
  repeats: 3
  direction: minimize
  tolerance: 0.02
  # Absolute floor on the band (metric units); keeps a zero full-data metric
  # from collapsing the band to exact equality.
  absolute_tolerance: 0.05
  # Binary target split for roc_auc/pr_auc; required for classification and
  # ignored for regression.
  # metric_threshold: 0.5
  output_dir: artifacts/training
  output_file: learning_curve.json
# Data Tracking bundle: the train step writes the ignored baseline truth
# (artifacts/tracking/baseline_stats.json); `ds-pipeline tracking` pure-renders
# the tracked reports/tracking/data_card.md from the persisted JSON.
tracking:
  machine_dir: artifacts/tracking
  reports_dir: reports/tracking
  profile_file: artifacts/discover/profile.json
  baseline:
    output_file: baseline_stats.json
    n_bins: 10
    top_k: 10
    smoothing: 0.0
  data_card:
    output_file: data_card.md
    missing_flag_rate: 0.05
    biases: []
    generated_at: null
