# STATE-20260921-004 custody: train logs the artifacts/tracking/ bundle copy
# as MLflow run artifacts (see log_datasets hook, 003); artifacts/tracking/
# stays git-ignored, reports/tracking/ stays the tracked published surface.
random_state: 42
n_jobs: -1
cv_folds: 5
cv_kind: kfold
model_file: model.pkl
n_estimators: 500
learning_rate: 0.05
num_leaves: 63
subsample: 0.8
colsample_bytree: 0.8
quantile_tail: 0.9
output_dir: artifacts/training
output_file: training_result.json
