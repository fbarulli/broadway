features:
  include:
    - rooms
    - area
    - neighborhood
  exclude: []
  derived:
    - name: price_per_area
      func: price / area
      source: area
  encodings:
    - type: target
      columns:
        - neighborhood
      smoothing: 20
model:
  type: linear
  params: {}
split:
  type: random
  validation_size: 0.2
random_state: 42
target_metric: rmse
