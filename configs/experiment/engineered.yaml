features:
  include:
    - rooms
    - area
    - neighborhood
  exclude: []
  derived:
    - name: price_per_area
      func: price / area
      source: area
  encodings:
    - type: target
      on:
        - neighborhood
      smoothing: 20
model:
  type: lightgbm
  params:
    num_leaves: 31
    learning_rate: 0.05
split:
  type: random
  validation_size: 0.2
random_state: 42
target_metric: rmse
