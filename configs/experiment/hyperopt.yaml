features:
  include:
    - rooms
    - area
    - neighborhood
  exclude: []
  derived: []
  encodings:
    - type: target
      columns:
        - neighborhood
      smoothing: 20
model:
  type: lgbm
  params: {}
split:
  type: random
  validation_size: 0.2
random_state: 42
target_metric: rmse
hpo:
  engine: optuna
  direction: minimize
  target_metric: rmse
  total_trials: 50
  initial_trials_per_model: 20
  top_k: 1
  models:
    - name: lgbm
      search_space:
        max_depth: [3, 10]
        learning_rate: [0.01, 0.3]
