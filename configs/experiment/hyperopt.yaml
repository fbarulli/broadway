data_source:
  loader: canonical
  schema_contract: raw
features:
  include:
    - feature_1
    - feature_2
    - feature_3
  exclude: []
  derived: []
  encodings:
    - type: target
      columns:
        - feature_3
      smoothing: 20
model:
  type: lgbm
  params: {}
split:
  type: random
  validation_size: 0.2
random_state: 42
target_metric: rmse
hpo:
  engine: optuna
  direction: minimize
  target_metric: rmse
  total_trials: 50
  initial_trials_per_model: 20
  top_k: 1
  models:
    - name: lgbm
      search_space:
        max_depth: [3, 10]
        learning_rate: [0.01, 0.3]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
