features:
  include:
    - rooms
    - area
    - neighborhood
  exclude: []
  derived: []
  encodings:
    - type: target
      on:
        - neighborhood
      smoothing: 20
model:
  type: xgboost
  params:
    max_depth: 6
    learning_rate: 0.1
split:
  type: random
  validation_size: 0.2
random_state: 42
target_metric: rmse
hpo:
  engine: optuna
  trials: 50
  search_space:
    max_depth:
      - 3
      - 10
    learning_rate:
      - 0.01
      - 0.3
