# Dependency registry — one row per direct dependency (CODE_STANDARD.md §4).
# Version specs stay in pyproject.toml (the version SSOT); this file records the
# owner, scope, purpose, adapter seam, license provenance, and the day each row
# entered this registry (not the package's publication date).
# Licenses are recorded, not gated: the platform is internal and undistributed.
#
# scope: platform | project | dev | optional
# adapter: dotted module that owns the seam; empty when the library is used directly.
