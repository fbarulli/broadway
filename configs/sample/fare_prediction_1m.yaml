name: fare_prediction_1m
role: estimation
version: "v3"
path: data/samples/fare_prediction_1m@v3.parquet
description: 1M random sample of the taxi training data, policy-filtered for fare prediction
source:
  name: training_data
  path: data/processed/training_data.parquet
seed: 42
size: 1000000
columns: [pickup_datetime, pickup_location_id, dropoff_location_id, fare_amount, trip_distance, trip_duration_minutes]
derived:
  - {name: speed_mph, formula: speed_mph}
# Plausibility exclusions from the 04 percentile-extremes audit (recorded
# decision: drop implausible low/high-fare trips — 189 rows on v1). Each
# inner group is AND; a row is dropped when ANY group fully matches.
exclude_any:
  - [{column: fare_amount, op: "<=", value: 4.40}, {column: trip_distance, op: ">", value: 5.0}]
  - [{column: fare_amount, op: "<=", value: 4.40}, {column: trip_duration_minutes, op: ">", value: 30.0}]
  - [{column: fare_amount, op: "<=", value: 4.40}, {column: speed_mph, op: ">", value: 60.0}]
  - [{column: fare_amount, op: ">=", value: 71.60}, {column: trip_distance, op: "<", value: 3.0}]
  - [{column: fare_amount, op: ">=", value: 71.60}, {column: trip_duration_minutes, op: "<", value: 5.0}]
  - [{column: fare_amount, op: ">=", value: 71.60}, {column: speed_mph, op: ">", value: 100.0}]
# Policy mirrors configs/experiments/working.yaml (min_fare: 2.50) — declared once here
filters:
  - {column: fare_amount, op: ">", value: 2.50}
  - {column: trip_distance, op: ">", value: 0.0}
  - {column: trip_duration_minutes, op: ">", value: 0.0}
schema:
  pickup_datetime: {dtype: "datetime64[ns]", nullable: false}
  pickup_location_id: {dtype: "int32", nullable: false}
  dropoff_location_id: {dtype: "int32", nullable: false}
  fare_amount: {dtype: float64, nullable: false, checks: [{op: ">", value: 0.0}]}
  trip_distance: {dtype: float64, nullable: false, checks: [{op: ">", value: 0.0}]}
  trip_duration_minutes: {dtype: float64, nullable: false, checks: [{op: ">", value: 0.0}]}
  speed_mph: {dtype: float64, nullable: false, checks: [{op: ">", value: 0.0}]}
