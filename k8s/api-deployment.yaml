apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadway-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broadway-api
  template:
    metadata:
      labels:
        app: broadway-api
    spec:
      containers:
        - name: api
          image: broadway:latest
          command:
            - uvicorn
            - inference.api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: broadway-api
spec:
  selector:
    app: broadway-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broadway-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: broadway-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
