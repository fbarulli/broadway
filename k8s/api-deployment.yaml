apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadway-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broadway-api
  template:
    metadata:
      labels:
        app: broadway-api
    spec:
      containers:
        - name: api
          image: broadway:latest
          command:
            - uvicorn
            - broadway.inference.api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          # api.py loads its model from the MLflow registry (module docstring);
          # MLFLOW_TRACKING_URI is the documented interpolation source of
          # configs/environment/production.yaml (mlflow_tracking_uri) and the
          # mlflow client's native variable.
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: environment
                  key: mlflow_tracking_uri
---
apiVersion: v1
kind: Service
metadata:
  name: broadway-api
spec:
  selector:
    app: broadway-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broadway-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: broadway-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Aligned with the documented api_hpa_cpu_threshold (80) in
          # configs/environment/production.yaml — the two values must agree.
          averageUtilization: 80
