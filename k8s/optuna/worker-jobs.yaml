# Three optuna worker Jobs — one pod per model, run to completion.
# Config/credentials come from mounted FILES; restartPolicy Never +
# backoffLimit bounds retries (no infinite restarts);
# ttlSecondsAfterFinished auto-deletes each Job 10 min after completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: optuna-ols
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: broadway-optuna-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/worker.py"]
          args: ["--model", "ols"]
          volumeMounts:
            - {name: config, mountPath: /etc/broadway/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: optuna-db, mountPath: /etc/broadway/secret, readOnly: true}
      volumes:
        - name: config
          configMap: {name: optuna-config}
        - name: optuna-db
          secret: {secretName: optuna-db}
