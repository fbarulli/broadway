# Single source of truth for the k8s optuna stack's INFRA — dataset source, DB
# endpoints, mlflow — mounted as a FILE (/etc/broadway/config.yaml), never
# injected as env vars. Optuna and mlflow MUST use separate databases: both use
# Alembic's `alembic_version` table, which would otherwise clash in a shared DB.
# The HPO spec (search spaces + trial budgets) lives in
# configs/experiments/mlflow.yaml (`hpo:`) — the worker reads it from there and
# only injects the RDB storage_url at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: optuna-config
data:
  config.yaml: |
    dataset:
      name: sample_evidence
      parquet: /app/experiments/results/univariate/sample_evidence/sample_evidence.parquet
      target: target
      fare_column: target
      min_fare: 2.5
      max_duration_minutes: 240
      pickup_datetime: pickup_datetime
      dropoff_datetime: dropoff_datetime
      features: [feature_1, feature_2, feature_3, duration_minutes, hour]
    databases:
      optuna: {driver: postgresql+psycopg2, host: postgres, port: "5432", name: optuna}
      mlflow: {driver: postgresql+psycopg2, host: postgres, port: "5432", name: mlflow}
    mlflow:
      tracking_uri: http://mlflow:5000
      experiment: model_battle
      allowed_hosts: "*"   # local kind cluster; tighten for real deployments
