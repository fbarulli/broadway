# Durable postgres: optuna and mlflow each get their OWN database (they both
# use Alembic's alembic_version table, which must not be shared). Credentials
# come from the mounted Secret FILES (POSTGRES_* exported inside the container
# from those files — our manifests set no env vars). The init script creates
# the second database on first boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  create-mlflow-db.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -c "CREATE DATABASE mlflow;"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              export POSTGRES_USER=$(cat /etc/broadway/secret/DB_USER)
              export POSTGRES_PASSWORD=$(cat /etc/broadway/secret/DB_PASSWORD)
              export POSTGRES_DB=$(cat /etc/broadway/secret/DB_NAME)
              exec docker-entrypoint.sh postgres
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: pg-data, mountPath: /var/lib/postgresql/data}
            - {name: optuna-db, mountPath: /etc/broadway/secret, readOnly: true}
            - {name: postgres-init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: pg-data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: optuna-db
          secret: {secretName: optuna-db}
        - name: postgres-init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
