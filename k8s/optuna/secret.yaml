# Template only. Real values: never commit. Generate locally via scripts below.
# k8s/optuna/lifecycle.sh resolves real credentials at run time from, in order:
#   1. exported DB_USER / DB_PASSWORD / DB_NAME env vars;
#   2. the gitignored k8s/optuna/secret.local.yaml (same schema as this file),
#      which it generates on first use via `openssl rand`.
# This committed file is never read or applied by lifecycle.sh.
apiVersion: v1
kind: Secret
metadata:
  name: optuna-db
type: Opaque
stringData:
  DB_USER: CHANGE_ME_BEFORE_APPLY
  DB_PASSWORD: CHANGE_ME_BEFORE_APPLY
  DB_NAME: CHANGE_ME_BEFORE_APPLY
