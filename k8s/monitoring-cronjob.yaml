apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitoring-drift
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: monitor
              image: broad-way:latest
              command:
                - uv
                - run
                - ds-pipeline
                - monitoring
                - --environment
                - production
          restartPolicy: Never
