# Non-secret environment surface for the top-level stack — the interpolation
# sources behind configs/environment/production.yaml's ${VARS}. Every value is
# derived from landed surfaces: data_dir → train PVC mount
# (k8s/train-job.yaml); mlflow_tracking_uri → Service `mlflow`
# (k8s/mlflow-deployment.yaml, same value as k8s/optuna/configmap.yaml);
# database_host → Service `postgres` below; database_port → docker-compose.yml
# default ${DATABASE_PORT:-5432}; database_user/name → documented development
# defaults (configs/environment/development.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment
data:
  data_dir: /workspace/data
  mlflow_tracking_uri: http://mlflow:5000
  database_user: postgres
  database_name: broadway
  database_host: postgres
  database_port: "5432"
---
# Credentials are never committed (HC-1 void precedent): placeholder skeleton
# following the k8s/optuna/secret.yaml template convention. Populate out of
# band before apply, e.g. kubectl create secret generic environment-secrets
# --from-literal=database_password=...
apiVersion: v1
kind: Secret
metadata:
  name: environment-secrets
type: Opaque
stringData:
  database_password: CHANGE_ME_BEFORE_APPLY
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: broadway-postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: environment
                  key: database_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: environment-secrets
                  key: database_password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: environment
                  key: database_name
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
