# Multivariate categorical breakdown — analysis policy (data-agnostic knobs).
# The dataset loader/filters are NOT here: they are owned by the univariate
# experiment's _common.py (single source of truth) and imported.
target: fare_amount
value_counts_head: 15
categorical:
  max_unique_for_int: 50        # int columns with <= this many unique values count as categorical
  exclude: [RatecodeID]         # constant in the working dataset (unique == 1)
  extra_categories: [time_bucket]  # derived categorical added by the loader
labels:
  payment_type: {1: credit card, 2: cash, 3: no charge, 4: dispute}
  VendorID: {1: creative_mobile, 2: verifone}
  store_and_fwd_flag: {Y: stored, N: not_stored}
