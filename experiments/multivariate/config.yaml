# Multivariate categorical breakdown — analysis policy (data-agnostic knobs).
# The dataset loader/filters are NOT here: they are owned by the univariate
# experiment's _common.py (single source of truth) and imported. The zone
# lookup path/columns are owned by project.data and reused here.
target: fare_amount
value_counts_head: 15
sample_role: diagnostic
categorical:
  max_unique_for_int: 50        # int columns with <= this many unique values count as categorical
  exclude: [RatecodeID, payment_type, passenger_count]
  extra_categories: [time_bucket, dropoff_borough]  # derived categoricals added by the loader
borough:
  pickup: {join_on: PULocationID, column: pickup_borough}
  dropoff: {join_on: DOLocationID, column: dropoff_borough}
sample:
  name: manhattan_sample
  pickup_borough: Manhattan      # Population A: Manhattan pickups only
borough_dummies:
  features: [trip_distance, duration_minutes]
  column: dropoff_borough
  reference: Manhattan
geography_premium:
  missing_label: Unmapped          # distinct from the real 'Unknown' zone value
labels:
  VendorID: {1: creative_mobile, 2: verifone}
  store_and_fwd_flag: {Y: stored, N: not_stored}
