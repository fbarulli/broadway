# Single source of truth for the k8s optuna stack's project-bound infra —
# dataset source, DB endpoints, and mlflow, mounted as a file.
# The HPO spec lives in project/config/experiments/mlflow.yaml; the worker
# injects the RDB storage URL at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: optuna-config
data:
  config.yaml: |
    dataset:
      name: sample_evidence
      parquet: /app/project/experiments/results/univariate/sample_evidence/sample_evidence.parquet
      target: target
      fare_column: target
      min_target_value: 2.5
      max_duration_minutes: 240
      pickup_datetime: pickup_datetime
      dropoff_datetime: dropoff_datetime
      features: [feature_1, feature_2, feature_3, duration_minutes, hour]
    databases:
      optuna: {driver: postgresql+psycopg2, host: postgres, port: "5432", name: optuna}
      mlflow: {driver: postgresql+psycopg2, host: postgres, port: "5432", name: mlflow}
    mlflow:
      tracking_uri: http://mlflow:5000
      experiment: model_battle
      allowed_hosts: "*"   # local kind cluster; tighten for real deployments
