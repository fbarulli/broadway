# amazon_champion — the selection champion (rf, default params) as a deployable
# experiment. No hpo block: the hpo step owns tuning, so training this
# experiment only fits the declared params (the holdout is never read to tune).
# `evaluation_tag` keeps its promotion record distinct from the tuned run's.
data_source:
  loader: canonical
  version: null
  schema_contract: engineered
feature_plan: project.features.amazon:plan
model:
  type: rf
  params:
    n_estimators: 300
    min_samples_leaf: 2
split:
  type: random
  validation_size: 0.2
random_state: 2026
target_metric: rmse
hpo: null
preprocessing: []
target_transforms: []
calibration: null
evaluation_tag: champion
