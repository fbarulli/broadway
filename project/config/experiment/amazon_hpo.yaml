# amazon_hpo — the HPO experiment contract for the Amazon champion.
# The champion is the model-selection winner (project/experiments/results/pipeline/
# selection/selection_champion.json yields `rf`); this config carries the SAME
# feature plan and the search space the hpo step tunes on training-only
# repeated CV. Params under `model.params` are the declared defaults the tuned
# params must beat. The holdout split is not read by the hpo step.
data_source:
  loader: canonical
  version: null
  schema_contract: engineered
feature_plan: project.features.amazon:plan
model:
  type: rf
  params:
    n_estimators: 300
    min_samples_leaf: 2
split:
  type: random
  validation_size: 0.2
random_state: 2026
target_metric: rmse
hpo:
  engine: optuna
  direction: minimize
  target_metric: rmse
  total_trials: 30
  initial_trials_per_model: 30
  top_k: 1
  models:
    - name: rf
      search_space:
        n_estimators: [100, 600]
        max_depth: [3, 20]
        min_samples_leaf: [1, 10]
        min_samples_split: [2, 20]
        max_samples: [0.5, 1.0]
preprocessing: []
target_transforms: []
calibration: null
