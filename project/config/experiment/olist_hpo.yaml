# olist_hpo — the tuning contract for the Olist champion (next unit executes it).
# Same feature plan, target and split as experiment/olist.yaml; only the search
# space and metric direction live here. PR-AUC is maximized because the binary
# target is imbalanced (14.7% bad); the holdout is never read by the hpo step.
data_source:
  loader: canonical
  version: null
  schema_contract: engineered
feature_plan: project.features.olist:plan
model:
  type: rf
  params:
    n_estimators: 300
    min_samples_leaf: 2
split:
  type: stratified
  validation_size: 0.2
random_state: 2026
target_metric: pr_auc
hpo:
  engine: optuna
  direction: maximize
  target_metric: pr_auc
  total_trials: 30
  initial_trials_per_model: 30
  top_k: 1
  models:
    - name: rf
      search_space:
        n_estimators: [100, 600]
        max_depth: [3, 20]
        min_samples_leaf: [1, 10]
        min_samples_split: [2, 20]
        max_samples: [0.5, 1.0]
# Every plan column is numeric; the ETL leaves real nulls in the item/payment
# aggregates (orders without item lines). Median imputation is fitted on the
# train split inside the model pipeline, so the holdout never informs it.
preprocessing:
  - type: imputation
    columns:
      - items_count
      - sellers_count
      - products_count
      - total_price
      - total_freight
      - mean_item_price
      - mean_product_weight_g
      - mean_product_photos_qty
      - mean_product_description_length
      - total_payment
      - max_installments
      - payment_type_count
      - customer_state_frequency_enc
      - customer_city_frequency_enc
      - customer_zip_code_prefix_frequency_enc
      - dominant_payment_type_frequency_enc
      - dominant_category_frequency_enc
      - seller_state_frequency_enc
    params:
      strategy: median
target_transforms: []
calibration: null
