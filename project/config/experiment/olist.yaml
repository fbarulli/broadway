# olist — the reference experiment contract for the order-grain classifier.
#
# Target: bad_review = (review_score <= 2), decided AT PURCHASE. The metric is
# PR-AUC (average precision) because 14,495 of 98,673 orders are bad (14.7%):
# accuracy would be 85% by predicting "good" always. `split` is stratified on
# the target because orders are exchangeable, not a time series; the next unit
# selects/HPO's candidates against this metric on the same folds.
data_source:
  loader: canonical
  version: null
  schema_contract: engineered
feature_plan: project.features.olist:plan
model:
  type: linear
  params: {}
split:
  type: stratified
  validation_size: 0.2
random_state: 2026
target_metric: pr_auc
hpo: null
# Every plan column is numeric; the ETL leaves real nulls in the item/payment
# aggregates (orders without item lines). Median imputation is fitted on the
# train split inside the model pipeline, so the holdout never informs it.
preprocessing:
  - type: imputation
    columns:
      - items_count
      - sellers_count
      - products_count
      - total_price
      - total_freight
      - mean_item_price
      - mean_product_weight_g
      - mean_product_photos_qty
      - mean_product_description_length
      - total_payment
      - max_installments
      - payment_type_count
      - customer_state_frequency_enc
      - customer_city_frequency_enc
      - customer_zip_code_prefix_frequency_enc
      - dominant_payment_type_frequency_enc
      - dominant_category_frequency_enc
      - seller_state_frequency_enc
    params:
      strategy: median
target_transforms: []
calibration: null
