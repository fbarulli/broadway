# Olist training binding (the modelling chain starts in the next unit).
# Rows are exchangeable orders, so the geometry is shuffled KFold, never a
# forward-chaining time split. The fit verdict's fold seed is disjoint from the
# selection/HPO seeds the next unit declares.
cv_kind: kfold
cv_gap: 0
cv_repeats: 5
cv_random_state: 4242
output_dir: project/experiments/results/pipeline/training
fit_decision:
  owner: olist
  action: "deploy the fitted model behind the evaluate promotion gate"
