# Olist feature-step binding: the base `configs/step/features.yaml` carries the
# generic mechanics; the imputation study's injected columns must exist in this
# dataset's column plan, so the whole block lives here.
#
# The report, figure and decision record are committed evidence on the
# dashboard's pipeline surface; the fitted pipeline itself stays in the
# dataset's processed store (cfg.etl), never here. This chain is deferred to the
# modelling unit; the columns below are Olist plan numerics with real nulls.
output_dir: project/experiments/results/pipeline/features
imputation_study:
  strategies: [median, mean, mode, knn]
  scalings: [none, standard]
  metric_direction: maximize
  sample_size: 10000
  knn_neighbors: 5
  missing_injection:
    rate: 0.10
    columns: [total_price, mean_product_weight_g]
  output_dir: artifacts/features
  output_file: imputation_impact.json
