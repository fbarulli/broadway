# Amazon HPO — training-only repeated CV for the selected champion.
# Search folds seed 7; the reported tuned score is read on seed 99, a partition
# neither the search nor the selection (2026) optimized against. The search
# space and trial budget live in experiment/amazon_hpo.yaml (SSOT).
metric: rmse
cv:
  folds: 5
  repeats: 3
  random_state: 7
report_random_state: 99
bootstrap:
  iterations: 2000
  seed: 7
  level: 0.95
selection_record: project/experiments/results/pipeline/selection/selection_champion.json
min_effect: 0.01
min_sample_size: 400
action: "adopt the HPO-best params only when the interval clears the floor"
owner: amazon
output_dir: project/experiments/results/pipeline/hpo
output_file: project/experiments/results/pipeline/hpo/hpo_champion.json
