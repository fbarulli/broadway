# Olist evaluate binding (the promotion check starts in the next unit).
# The holdout decision metric is PR-AUC for the imbalanced binary target; the
# time-series cv_decision and the threshold decision block are nulled because
# this chain is not a forecast and the cutoff is not yet calibrated. Cross-
# sectional orders use the stratified holdout split, never time CV.
target_metric: pr_auc
promotion_threshold: 0.02
record_stem: promotion
output_dir: project/experiments/results/pipeline/evaluate
output_file: metrics.json
cv_decision: null
decision: null
