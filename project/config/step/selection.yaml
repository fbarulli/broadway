# Olist model selection (execution deferred to the next unit).
# Rows are exchangeable at the ORDER level only after grouping by customer:
# random folds leak repeat buyers and memorise the 6.6-rows-per-zip cardinality.
# The dataset contract declares `group_column: customer_unique_id`, so the
# repeated CV below is a GroupKFold and the grouping is recorded in the record's
# provenance.
#
# Prerequisites (now met by the platform):
#  - metric = pr_auc / secondary = f1 with `metric_direction: max` and
#    `secondary_direction: max` (read from this config, never a hardcoded MINIMIZE);
#  - the no-skill prevalence candidate (`model: naive_prevalence`) replaces the
#    regression naive_mean reference.
metric: pr_auc
secondary_metric: f1
metric_direction: max
secondary_direction: max
cv:
  folds: 5
  repeats: 5
  random_state: 2026
sensitivity_random_state: 77
bootstrap:
  iterations: 2000
  seed: 2026
  level: 0.95
selection_rule: point
baseline_candidate: naive_prevalence
linear_reference: linear
candidates:
  - name: naive_prevalence
    model: naive_prevalence
    params: {}
  - name: linear
    model: linear
    params: {}
  - name: rf
    model: rf
    params:
      n_estimators: 300
      min_samples_leaf: 2
  - name: lgbm
    model: lgbm
    params:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
min_effect: 0.02
min_sample_size: 400
action: "carry the selected champion into HPO and a holdout promotion check"
owner: olist
output_dir: project/experiments/results/pipeline/selection
output_file: project/experiments/results/pipeline/selection/selection_champion.json
