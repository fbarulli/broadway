# Olist model selection (the chain is deferred to the next unit).
# Rows are exchangeable orders, so the geometry is repeated SHUFFLED KFold
# (5 x 5); every candidate scores on the identical folds. The metric is PR-AUC
# (average precision) and F1, not accuracy, because 14.7% of orders are bad.
# The reserved `naive_mean` reference is regression-only; the next unit replaces
# it with the no-skill prevalence reference before this step runs.
metric: pr_auc
secondary_metric: f1
cv:
  folds: 5
  repeats: 5
  random_state: 2026
sensitivity_random_state: 77
bootstrap:
  iterations: 2000
  seed: 2026
  level: 0.95
selection_rule: point
baseline_candidate: naive_mean
linear_reference: linear
candidates:
  - name: naive_mean
    model: naive_mean
    params: {}
  - name: linear
    model: linear
    params: {}
  - name: rf
    model: rf
    params:
      n_estimators: 300
      min_samples_leaf: 2
  - name: lgbm
    model: lgbm
    params:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
min_effect: 0.02
min_sample_size: 400
action: "carry the selected champion into HPO and a holdout promotion check"
owner: olist
output_dir: project/experiments/results/pipeline/selection
output_file: project/experiments/results/pipeline/selection/selection_champion.json
