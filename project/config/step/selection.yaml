# Amazon model selection — candidates, repeated-CV geometry, and the rule.
# Rows are exchangeable survey respondents, so the geometry is repeated
# SHUFFLED KFold (5 x 5); a forward-chaining time geometry would train on rows
# after the rows it scores. Every candidate scores on the identical folds.
metric: rmse
secondary_metric: mae
cv:
  folds: 5
  repeats: 5
  random_state: 2026
# The sensitivity re-runs champion-vs-naive under a different fold seed.
sensitivity_random_state: 77
bootstrap:
  iterations: 2000
  seed: 2026
  level: 0.95
baseline_candidate: naive_mean
linear_reference: linear
candidates:
  - name: naive_mean
    model: naive_mean
    params: {}
  - name: linear
    model: linear
    params: {}
  - name: rf
    model: rf
    params:
      n_estimators: 300
      min_samples_leaf: 2
  - name: lgbm
    model: lgbm
    params:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
  - name: xgb
    model: xgb
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 4
      subsample: 0.8
      colsample_bytree: 0.8
min_effect: 0.02
min_sample_size: 400
action: "carry the selected champion into HPO and a holdout promotion check"
owner: amazon
output_dir: project/experiments/results/pipeline/selection
output_file: project/experiments/results/pipeline/selection/selection_champion.json
