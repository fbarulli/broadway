name: amazon
mode: prediction
goal: identify which self-reported shopping behaviours associate most strongly with
  customer satisfaction, so the storefront team can prioritise them
row_definition: one survey respondent
decision_moment: when deciding which reported behaviours to prioritise on the storefront
available_info:
- self-reported shopping behaviours (survey answers)
- shopping satisfaction rating
leakage_notes:
- 'cross-sectional survey: associations are not causal and no behaviour is measured
  after the satisfaction rating'
success_criterion: publish one association with its interval and permutation null
  at n=602
hypothesis: null
