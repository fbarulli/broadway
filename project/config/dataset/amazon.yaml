name: amazon
path: data/raw/amazon/amazon_consumer_behavior_survey.csv
target: Shopping_Satisfaction
task: regression
datetime_column: null
# Hand-fixes over the `init` scaffold (recorded in
# agents/ledger/arbitration/2026-11-27/amazon-dataset-proposal.md):
#  - path: pointed back at the untouched raw CSV (init saw a normalized copy)
#  - datetime_column: null (Timestamp is ignored, not the datetime column)
#  - column_renames: two raw headers carry a trailing space and collide with a
#    different variable when stripped; the rename gives each its own label
#  - processed_subdir / artifacts_subdir: this dataset's processed artifacts live
#    in data/processed/amazon and its machine evidence under artifacts/amazon/,
#    so an Amazon run cannot overwrite the taxi artifacts or tracked figures
column_renames:
  "Personalized_Recommendation_Frequency ": recommendation_personalization_score
  "Rating_Accuracy ": rating_accuracy_score
processed_subdir: processed/amazon
artifacts_subdir: amazon
columns:
