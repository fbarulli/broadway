# amazon_survey experiment — run knobs and per-step decision rules (SSOT).
# Loaded by project/experiments/amazon_survey/01_profile.py through
# DecisionRuleSet.from_yaml; no seed, threshold, family, criterion or resample
# budget lives in the step script (agents/contracts/EXPERIMENT_OUTPUT.md).
# The dataset this series measures (SSOT for the step; the contract owns its
# target, columns and paths).
dataset: amazon
seed: 42
iterations: 1000

# The decision metric is |Spearman rho| between the reported importance of
# rating accuracy (ordinal 1-5) and the dataset's target (dataset/amazon.yaml
# owns it). `feature` was ranked first by the EDA step; `family` is that same
# ranking, so the selection-adjusted null is the max |rho| over every feature a
# pick could have been made from. Re-running EDA and re-ranking therefore needs
# a config edit here: the null and the record cannot silently drift apart.
feature: rating_accuracy_score
family:
  - rating_accuracy_score
  - recommendation_personalization_score
  - Customer_Reviews_Importance
  - Product_Search_Method
  - Review_Reliability
  - Cart_Completion_Frequency
  - Add_to_Cart_Browsing
  - Review_Helpfulness
  - Recommendation_Helpfulness
  - Saveforlater_Frequency
  - Browsing_Frequency
  - Cart_Abandonment_Factors

decisions:
  "01_profile":
    metric: satisfaction_rating_accuracy_rho
    direction: max
    min_effect: 0.15
    min_sample_size: 100
    action: "treat rating accuracy as a candidate satisfaction driver and re-check it in a held-out model before the storefront acts on it"
    owner: amazon_survey
