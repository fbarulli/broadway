# timeseries experiment scripts — run knobs and the output-contract rules.
# Loaded by project/experiments/timeseries/_common.py; every verdict is
# computed from the metric's 95% interval against these thresholds
# (agents/contracts/EXPERIMENT_OUTPUT.md).
seed: 42

decisions:
  # 01 asks whether the canonical frame is contiguous enough for lag features.
  "01_series_profile":
    metric: missing_hour_share
    direction: max
    min_effect: 0.01
    min_sample_size: 100
    action: "repair the gaps or shorten the forecast horizon to the contiguous block"
    owner: timeseries
  # 02 asks whether weekday structure is large enough to carry as a covariate.
  "02_seasonality":
    metric: weekend_weekday_gap
    direction: max
    min_effect: 0.10
    min_sample_size: 168
    action: "carry day-of-week in the forecast covariates"
    owner: timeseries
  # 03 asks where the memory lives: the 24h autocorrelation must clear noise
  # for a seasonal-naive baseline to be meaningful.
  "03_stationarity_acf":
    metric: hourly_acf_lag24
    direction: max
    min_effect: 0.20
    min_sample_size: 168
    action: "use the 24h seasonal-naive lag as the forecast baseline"
    owner: timeseries
  # 04 asks whether any model beats the seasonal-naive baseline on the
  # untouched holdout (relative MAE improvement).
  "04_forecast_models":
    metric: mae_improvement_vs_seasonal_naive
    direction: max
    min_effect: 0.02
    min_sample_size: 336
    action: "promote the champion as the demand forecast"
    owner: timeseries
