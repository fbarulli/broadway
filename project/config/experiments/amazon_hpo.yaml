# amazon_hpo — the HPO spec for the project's Amazon dataset (SSOT).
# Read by the platform HPO lane (gpu_training/config/hpo_kernel.yaml -> hpo_spec)
# and by the shared `broadway.training.hpo` API. The search space, direction,
# metric and trial budget live here; no profile or script repeats them.
seed: 42
test_fraction: 0.2
continuous_features:
  - age
  - Customer_Reviews_Importance
  - recommendation_personalization_score
  - rating_accuracy_score
categorical_features:
  - Gender
  - Purchase_Frequency
  - Browsing_Frequency
  - Review_Reliability
  - Recommendation_Helpfulness
hpo:
  engine: optuna
  direction: minimize
  target_metric: rmse
  total_trials: 60
  initial_trials_per_model: 20
  top_k: 2
  models:
    - name: lgbm
      search_space:
        n_estimators: [50, 500]
        max_depth: [3, 12]
        learning_rate: [0.01, 0.3]
        num_leaves: [8, 127]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
        min_child_samples: [5, 100]
        reg_alpha: [1e-3, 10]
        reg_lambda: [1e-3, 10]
    - name: xgb
      search_space:
        n_estimators: [50, 500]
        max_depth: [3, 12]
        learning_rate: [0.01, 0.3]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
        min_child_weight: [1, 10]
        reg_alpha: [1e-3, 10]
        gamma: [0.0, 5.0]
    - name: linear
      search_space: {}
