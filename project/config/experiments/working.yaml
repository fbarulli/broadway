# Tutorial working dataset — single source of truth.
# Consumed by project/working.py; all three experiments (univariate,
# multivariate, mlflow) load through it. Nothing is hardcoded in code.
parquet: experiments/results/univariate/sample_evidence/sample_evidence.parquet
columns:
  target: fare_amount  # real column in the TLC-derived evidence blob (generic KEY, truthful VALUE)
  pickup_datetime: tpep_pickup_datetime
  dropoff_datetime: tpep_dropoff_datetime
min_target_value: 2.50       # base target value; below this = voided rides
max_duration_minutes: 240    # 4h cap for realistic NYC trips
time_buckets:                # hour -> bucket boundaries (NYC surcharge rules)
  day: {start: 6, end: 16}
  peak: {start: 16, end: 20}
time_bucket_default: overnight
