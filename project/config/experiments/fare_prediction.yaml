# fare_prediction experiment scripts — run knobs (single source of truth).
# Loaded by project/experiments/fare_prediction/_common.py via require_keys; no seed
# literal stays in the step scripts (determinism ledger item f). Sample
# shape/filters remain owned by the sample registry
# (project/config/sample/fare_prediction_1m.yaml).
seed: 42

# Output contract (agents/contracts/EXPERIMENT_OUTPUT.md): one decision per step.
# The verdict is computed from the metric's 95% interval against this threshold;
# a step cannot publish a figure without it.
decisions:
  "01_generate_sample":
    metric: ks_fare_amount
    direction: max
    min_effect: 0.01
    min_sample_size: 1000
    action: "review the fare-policy exclusion before training"
    owner: fare_prediction
